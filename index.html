<!doctype html>
<html lang="tr" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fiyat Takip">
<title>Sina Pırlanta · Fiyat Takip</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="stylesheet" href="style.css">
<script>
  // Tema, ilk boyamadan önce uygulanır (yanıp sönme olmasın)
  try { document.documentElement.dataset.theme = localStorage.getItem('sp_theme') || 'system'; if (localStorage.getItem('sp_side') === '1') document.documentElement.dataset.side = 'mini'; } catch (e) {}
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 13.5V20h5.5v-5h5v5H20v-6.5M3 12l9-8 9 8"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.5 2h-15zM10 20.5a2.2 2.2 0 0 0 4 0"/></symbol>
  <symbol id="i-compare" viewBox="0 0 24 24"><path d="M8 4v16M16 4v16M3.5 8.5 8 4l4.5 4.5M11.5 15.5 16 20l4.5-4.5"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3.5 9 4.75-9 4.75-9-4.75zM3 12.5l9 4.75 9-4.75M3 16.5l9 4.75 9-4.75"/></symbol>
  <symbol id="i-gem" viewBox="0 0 24 24"><path d="M7 4h10l4 5.5L12 20.5 3 9.5zM3 9.5h18M9.5 4 8 9.5l4 11 4-11L14.5 4"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V20.5H7zM14 3.5v4h4M10 12.5h5M10 16h5"/></symbol>
  <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12.5h4l2.5-6 4 12 2.5-6h5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="i-side" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M9.5 5v14"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="18.5" cy="12" r="1.3" fill="currentColor"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 4.5H6.5v15H14M10.5 12h10M17 8.5l3.5 3.5-3.5 3.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 5.5 6.5 6.5L9 18.5"/></symbol>
</defs></svg>

<!-- Giriş -->
<div id="login" class="login" hidden>
  <div class="login-glow" aria-hidden="true"></div>
  <form id="loginForm" class="login-card" autocomplete="on" novalidate>
    <div class="brand-tile"><img src="img/logo.png" alt="Sina Pırlanta" width="190" height="71"></div>
    <h1>Fiyat Takip</h1>
    <p class="t-sub">Rakip fiyat analizi · e-ticaret birimi</p>
    <div class="field"><label for="lu">Kullanıcı adı</label><input id="lu" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></div>
    <div class="field"><label for="lp">Şifre</label><input id="lp" name="password" type="password" autocomplete="current-password" required></div>
    <div id="loginErr" class="form-err" role="alert" hidden></div>
    <button class="btn primary lg" id="loginBtn" type="submit">Giriş yap</button>
  </form>
</div>

<!-- Uygulama kabuğu -->
<div id="app" class="app" hidden>
  <a class="skip" href="#view">İçeriğe geç</a>
  <aside class="side" aria-label="Kenar çubuğu">
    <div class="side-top">
      <div class="brand-tile sm"><img src="img/logo.png" alt="Sina Pırlanta" width="150" height="56"></div>
      <button class="icon-btn" id="sideToggle" aria-label="Kenar çubuğunu daralt veya genişlet" data-tip="Kenar çubuğu  ⌘B"><svg class="ic"><use href="#i-side"/></svg></button>
    </div>
    <button class="search-btn" id="paletteBtn" aria-label="Ara veya sayfaya git"><svg class="ic"><use href="#i-search"/></svg><span>Ara</span><kbd>⌘K</kbd></button>
    <nav id="nav" class="nav" aria-label="Ana menü">
      <div class="nav-label">Analiz</div>
      <a href="#/genel" data-r="genel"><svg class="ic"><use href="#i-home"/></svg><span>Genel Bakış</span></a>
      <a href="#/kiyas" data-r="kiyas"><svg class="ic"><use href="#i-compare"/></svg><span>Model Kıyaslama</span></a>
      <a href="#/karsilastirma" data-r="karsilastirma"><svg class="ic"><use href="#i-layers"/></svg><span>Segmentler</span></a>
      <a href="#/bildirimler" data-r="bildirimler"><svg class="ic"><use href="#i-bell"/></svg><span>Bildirimler</span><b id="navBadge" class="badge" hidden></b></a>
      <div class="nav-label">Katalog</div>
      <a href="#/urunler" data-r="urunler"><svg class="ic"><use href="#i-gem"/></svg><span>Ürünler</span></a>
      <a href="#/raporlar" data-r="raporlar"><svg class="ic"><use href="#i-doc"/></svg><span>Raporlar</span></a>
      <div class="nav-label">Sistem</div>
      <a href="#/durum" data-r="durum"><svg class="ic"><use href="#i-pulse"/></svg><span>Veri Durumu</span></a>
    </nav>
    <div class="side-foot">
      <button class="nav-row" id="themeBtn" aria-label="Tema değiştir"><svg class="ic"><use href="#i-theme"/></svg><span id="themeLbl">Tema: Sistem</span></button>
      <button class="nav-row" id="logout"><svg class="ic"><use href="#i-out"/></svg><span>Çıkış yap</span></button>
      <div id="who" class="who"></div>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="top-title">
        <h1 id="pageTitle">Genel Bakış</h1>
        <div id="pageSub" class="t-sub"></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn only-mobile" id="paletteBtnM" aria-label="Ara"><svg class="ic"><use href="#i-search"/></svg></button>
        <label class="ref"><span>Referans</span><select id="refSel" aria-label="Referans marka"></select></label>
      </div>
    </header>
    <div id="banners" class="banners"></div>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <!-- Mobil sekme çubuğu -->
  <nav class="tabbar" id="tabbar" aria-label="Alt menü">
    <span class="tab-ind" aria-hidden="true"></span>
    <a href="#/genel" data-r="genel"><svg class="ic"><use href="#i-home"/></svg><span>Genel</span></a>
    <a href="#/kiyas" data-r="kiyas"><svg class="ic"><use href="#i-compare"/></svg><span>Kıyas</span></a>
    <a href="#/bildirimler" data-r="bildirimler"><svg class="ic"><use href="#i-bell"/></svg><span>Bildirim</span><b id="tabBadge" class="badge" hidden></b></a>
    <a href="#/urunler" data-r="urunler"><svg class="ic"><use href="#i-gem"/></svg><span>Ürünler</span></a>
    <button id="moreBtn" data-r="more" aria-haspopup="dialog"><svg class="ic"><use href="#i-more"/></svg><span>Diğer</span></button>
  </nav>
</div>

<!-- Detay paneli: masaüstünde yan panel, mobilde alttan açılan sayfa -->
<div id="drawer" class="sheet-root" hidden role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="scrim" data-close></div>
  <div class="sheet" id="drawerPanel">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-head"><h2 id="drawerTitle"></h2><button class="icon-btn" data-close aria-label="Kapat"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div id="drawerBody" class="sheet-body"></div>
  </div>
</div>

<!-- Mobil "Diğer" menüsü -->
<div id="more" class="sheet-root menu" hidden role="dialog" aria-modal="true" aria-label="Diğer">
  <div class="scrim" data-close></div>
  <div class="sheet">
    <div class="grab" aria-hidden="true"></div>
    <div class="menu-list">
      <a href="#/karsilastirma" data-close><svg class="ic"><use href="#i-layers"/></svg><span>Segmentler</span><svg class="ic chev"><use href="#i-chev"/></svg></a>
      <a href="#/raporlar" data-close><svg class="ic"><use href="#i-doc"/></svg><span>Raporlar</span><svg class="ic chev"><use href="#i-chev"/></svg></a>
      <a href="#/durum" data-close><svg class="ic"><use href="#i-pulse"/></svg><span>Veri Durumu</span><svg class="ic chev"><use href="#i-chev"/></svg></a>
    </div>
    <div class="menu-list">
      <button id="themeBtnM"><svg class="ic"><use href="#i-theme"/></svg><span>Tema</span><em id="themeLblM">Sistem</em></button>
      <button id="logoutM" class="danger"><svg class="ic"><use href="#i-out"/></svg><span>Çıkış yap</span></button>
    </div>
    <div id="whoM" class="who center"></div>
  </div>
</div>

<!-- Komut paleti -->
<div id="palette" class="palette-root" hidden role="dialog" aria-modal="true" aria-label="Ara">
  <div class="scrim" data-close></div>
  <div class="palette">
    <div class="palette-in"><svg class="ic"><use href="#i-search"/></svg><input id="palIn" type="search" placeholder="Sayfa, ürün adı veya kodu ara" autocomplete="off" spellcheck="false" aria-controls="palList"><kbd>esc</kbd></div>
    <div id="palList" class="palette-list" role="listbox"></div>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="tip" class="tip" hidden role="tooltip"></div>
<script src="vendor/chart.umd.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
